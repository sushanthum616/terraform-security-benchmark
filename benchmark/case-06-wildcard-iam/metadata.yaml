case_id: case-06
title: Wildcard IAM permissions
aws_resource: aws_iam_policy
security_category: access_control
vulnerability_description: The policy allows every action on every resource.
security_impact: A principal receiving this policy could make arbitrary AWS API changes.
ground_truth_expectation: vulnerable=true; secure=false
expected_vulnerable_result: Detect wildcard action and resource permissions.
expected_corrected_result: No finding for the benchmark issue.
